services:
  edge:
    image: nginx:alpine
    container_name: edge
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      blue-web:
        condition: service_healthy
      green-web:
        condition: service_healthy
    restart: unless-stopped
    networks: [appnet]

  blue-web:
    build: ./app
    container_name: blue-web
    environment:
      BACKEND_NAME: blue
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [appnet]

  green-web:
    build: ./app
    container_name: green-web
    environment:
      BACKEND_NAME: green
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [appnet]

  collector:
    build: ./collector
    container_name: collector
    volumes:
      - ./nginx/logs:/logs
    depends_on:
      - edge
    networks: [appnet]

networks:
  appnet:
    driver: bridge